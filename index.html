<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWTPC-6800 ELIZA - Retro CRT Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Courier New', 'Courier', monospace;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CRT Monitor Bezel - Physical Monitor Frame */
        .monitor-bezel {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 40px solid #2a2a2a;
            border-radius: 25px;
            box-shadow: 
                0 0 80px rgba(0, 0, 0, 0.95),
                inset 0 0 80px rgba(0, 0, 0, 0.9),
                0 30px 60px rgba(0, 0, 0, 0.95),
                inset 0 -2px 5px rgba(255, 255, 255, 0.1),
                inset 0 2px 5px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* CRT Glass/Screen Surface */
        .screen-glass {
            flex: 1;
            position: relative;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Main display area */
        .crt-display {
            flex: 1;
            padding: 35px;
            background-color: #000000;
            color: #00ff00;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            position: relative;
            z-index: 50;
            text-shadow: 0 0 5px #00ff00;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines - CRT horizontal lines */
        .crt-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.20),
                rgba(0, 0, 0, 0.20) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Phosphor glow - edge darkening */
        .crt-display::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.4) 100%);
            pointer-events: none;
            z-index: 101;
        }

        /* Content - sits above scanlines */
        .display-content {
            position: relative;
            z-index: 50;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Header */
        .screen-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #00ff00;
            line-height: 1.2;
        }

        .screen-header h1 {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin: 0;
        }

        .screen-header .model {
            font-size: 12px;
            color: #00ff00;
            opacity: 0.7;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Scrollable conversation area */
        .conversation-display {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
            color: #00ff00;
        }

        .conversation-display::-webkit-scrollbar {
            width: 6px;
        }

        .conversation-display::-webkit-scrollbar-track {
            background: #000000;
        }

        .conversation-display::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 3px;
        }

        /* Each line in conversation */
        .display-line {
            margin: 2px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #00ff00;
            font-size: 13px;
            line-height: 1.4;
        }

        .display-line.system {
            opacity: 0.6;
            font-style: italic;
        }

        .display-line.user {
            font-weight: bold;
            color: #00ff00;
        }

        .display-line.eliza {
            color: #00ff00;
        }

        /* Input line */
        .input-line {
            border-top: 2px solid #00ff00;
            padding-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .prompt {
            color: #00ff00;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 13px;
        }

        #textInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            caret-color: #00ff00;
        }

        #textInput::placeholder {
            color: #00ff00;
            opacity: 0.4;
        }

        #textInput:focus {
            text-shadow: 0 0 5px #00ff00;
        }

        /* Blinking cursor */
        .cursor {
            width: 8px;
            height: 1.4em;
            background-color: #00ff00;
            display: inline-block;
            animation: cursor-blink 0.7s infinite;
            margin-left: 3px;
            flex-shrink: 0;
        }

        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #textInput:focus ~ .cursor {
            display: none;
        }

        /* Dev mode button - subtle */
        .dev-button {
            position: fixed;
            bottom: 15px;
            left: 15px;
            padding: 6px 12px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            opacity: 0.4;
            z-index: 1000;
            letter-spacing: 1px;
        }

        .dev-button:hover {
            opacity: 0.8;
        }

        /* Dev panels - full screen overlay */
        .dev-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: 999;
            overflow-y: auto;
            padding: 20px;
            color: #00ff00;
        }

        .dev-overlay.active {
            display: block;
        }

        .dev-overlay button {
            padding: 6px 12px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin: 3px;
            opacity: 0.8;
        }

        .dev-overlay button:hover {
            opacity: 1;
            background-color: #003300;
        }

        .dev-section {
            border: 1px solid #00ff00;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0a0a0a;
        }

        .dev-section h3 {
            font-size: 12px;
            margin-bottom: 8px;
            text-decoration: underline;
        }

        .dev-close {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            z-index: 1001;
        }

        .dev-close:hover {
            background-color: #00ff00;
            color: #000000;
        }
    </style>
</head>
<body>
    <!-- Main CRT Monitor -->
    <div class="monitor-bezel">
        <div class="screen-glass">
            <div class="crt-display">
                <div class="display-content">
                    <div class="screen-header">
                        <h1>SWTPC-6800 ELIZA</h1>
                        <div class="model">THERAPIST v1.0</div>
                    </div>

                    <div class="conversation-display" id="display">
                        <div class="display-line system">Welcome to ELIZA v1.0 on SWTPC-6800</div>
                        <div class="display-line system">=====================================</div>
                    </div>

                    <div class="input-line">
                        <span class="prompt">YOU:</span>
                        <input type="text" id="textInput" placeholder="Enter your thoughts...">
                        <span class="cursor"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dev Mode Button -->
    <button class="dev-button" onclick="toggleDevMode()">[ DEV ]</button>

    <!-- Dev Mode Overlay -->
    <div class="dev-overlay" id="devOverlay">
        <button class="dev-close" onclick="toggleDevMode()">CLOSE</button>

        <div class="dev-section">
            <h3>CPU CONTROLS</h3>
            <button onclick="emulator.run()">▶ RUN</button>
            <button onclick="emulator.pause()">⏸ PAUSE</button>
            <button onclick="emulator.step()">⏭ STEP</button>
            <button onclick="emulator.reset()">🔄 RESET</button>
            <br><br>
            Speed: <input type="range" id="speedSlider" min="1" max="100" value="50" style="width: 150px;">
        </div>

        <div class="dev-section">
            <h3>CPU STATE</h3>
            <div id="cpuState" style="font-size: 11px; font-family: monospace; line-height: 1.6;"></div>
        </div>

        <div class="dev-section">
            <h3>MEMORY GRID (0x00-0xFF)</h3>
            <div id="memoryGrid" style="display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; font-size: 9px;"></div>
        </div>
    </div>

    <script src="cpu6800.js"></script>
    <script src="eliza.js"></script>
    <script src="emulator.js"></script>
    <script>
        // Initialize emulator
        const emulator = new Emulator();
        emulator.init();

        const display = document.getElementById('display');
        const textInput = document.getElementById('textInput');
        const cursor = document.querySelector('.cursor');
        const devOverlay = document.getElementById('devOverlay');

        // Focus input on page load
        setTimeout(() => {
            textInput.focus();
        }, 100);

        // Handle input
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const message = textInput.value.trim();
                if (message) {
                    addLine('user', message);
                    emulator.sendInput(message);
                    textInput.value = '';
                    textInput.focus();
                }
            }
        });

        // Speed control
        const speedSlider = document.getElementById('speedSlider');
        if (speedSlider) {
            speedSlider.addEventListener('change', (e) => {
                emulator.setSpeed(parseInt(e.target.value));
            });
        }

        // Add line to display
        function addLine(type, text) {
            const line = document.createElement('div');
            line.className = 'display-line ' + type;
            
            if (type === 'user') {
                line.textContent = 'YOU: ' + text;
            } else if (type === 'eliza') {
                line.textContent = 'ELIZA: ' + text;
            } else {
                line.textContent = text;
            }
            
            display.appendChild(line);
            display.scrollTop = display.scrollHeight;
        }

        // ELIZA output handler
        window.onELIZAOutput = (text) => {
            addLine('eliza', text);
        };

        // Dev mode toggle
        function toggleDevMode() {
            devOverlay.classList.toggle('active');
            if (devOverlay.classList.contains('active')) {
                updateDevDisplay();
            }
        }

        // Update dev panels
        setInterval(() => {
            if (devOverlay.classList.contains('active')) {
                updateDevDisplay();
            }
        }, 100);

        function updateDevDisplay() {
            const cpu = emulator.cpu;
            
            // CPU State
            document.getElementById('cpuState').innerHTML = `PC: $${cpu.pc.toString(16).padStart(4, '0')} | A: $${cpu.a.toString(16).padStart(2, '0')} | B: $${cpu.b.toString(16).padStart(2, '0')} | X: $${cpu.x.toString(16).padStart(4, '0')}<br>SP: $${cpu.sp.toString(16).padStart(4, '0')} | CC: $${cpu.cc.toString(16).padStart(2, '0')} | Instructions: ${cpu.instructionCount}`;

            // Memory grid
            const memoryGrid = document.getElementById('memoryGrid');
            if (memoryGrid.children.length === 0) {
                for (let i = 0; i < 256; i++) {
                    const cell = document.createElement('div');
                    cell.style.border = '1px solid #003300';
                    cell.style.padding = '2px';
                    cell.style.textAlign = 'center';
                    cell.style.backgroundColor = '#0a0a0a';
                    cell.id = 'mem-' + i;
                    memoryGrid.appendChild(cell);
                }
            }
            for (let i = 0; i < 256; i++) {
                const cell = document.getElementById('mem-' + i);
                if (cell) {
                    cell.textContent = emulator.cpu.memory[i].toString(16).padStart(2, '0').toUpperCase();
                }
            }
        }
    </script>
</body>
</html>
