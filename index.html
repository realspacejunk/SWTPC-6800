<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWTPC-6800 ELIZA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        /* CRT Monitor Bezel */
        .crt-bezel {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 30px solid #2a2a2a;
            border-radius: 20px;
            box-shadow: 
                0 0 60px rgba(0, 0, 0, 0.8),
                inset 0 0 60px rgba(0, 0, 0, 0.8),
                0 20px 40px rgba(0, 0, 0, 0.9);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* CRT Screen */
        .crt-screen {
            flex: 1;
            background-color: #000;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow: hidden;
            position: relative;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff0088;
            line-height: 1.4;
            font-size: clamp(11px, 2vw, 16px);
        }

        /* Scanlines effect */
        .crt-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Phosphor glow */
        .crt-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 101;
        }

        /* Content wrapper */
        .crt-content {
            position: relative;
            z-index: 50;
            display: flex;
            flex-direction: column;
            height: 100%;
            color: #00ff00;
        }

        /* Header */
        .crt-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .crt-header h1 {
            font-size: 1.2em;
            margin: 0;
            color: #00ff00;
        }

        .crt-header p {
            font-size: 0.8em;
            opacity: 0.7;
            margin: 5px 0 0 0;
        }

        /* Conversation area */
        .crt-conversation {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
            scrollbar-width: thin;
            scrollbar-color: #00ff00 #000;
        }

        .crt-conversation::-webkit-scrollbar {
            width: 4px;
        }

        .crt-conversation::-webkit-scrollbar-track {
            background: #000;
        }

        .crt-conversation::-webkit-scrollbar-thumb {
            background: #00ff00;
        }

        /* Conversation lines */
        .crt-line {
            margin: 3px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .crt-line.system {
            opacity: 0.7;
            font-style: italic;
        }

        .crt-line.user {
            color: #00ff00;
            font-weight: bold;
        }

        .crt-line.eliza {
            color: #00ff00;
        }

        .crt-line.prompt {
            color: #00ff00;
            font-weight: bold;
        }

        /* Blinking cursor */
        .crt-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: #00ff00;
            animation: blink 0.7s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Input section */
        .crt-input-area {
            border-top: 1px solid #00ff00;
            padding-top: 10px;
            display: flex;
            gap: 5px;
        }

        .crt-input-area span {
            color: #00ff00;
            font-weight: bold;
            flex-shrink: 0;
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            outline: none;
            font-size: inherit;
        }

        #userInput::placeholder {
            color: #00ff00;
            opacity: 0.5;
        }

        #userInput:focus {
            text-shadow: 0 0 10px #00ff00;
        }

        /* Dev mode toggle */
        .dev-toggle {
            position: fixed;
            bottom: 10px;
            left: 10px;
            padding: 5px 10px;
            background-color: #003300;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            opacity: 0.5;
            z-index: 1000;
        }

        .dev-toggle:hover {
            opacity: 1;
        }

        /* Hidden dev panels */
        .dev-panels {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 999;
            overflow: auto;
            padding: 10px;
            color: #00ff00;
        }

        .dev-panels.visible {
            display: block;
        }

        .dev-panel {
            border: 1px solid #00ff00;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #0a0a0a;
        }

        .dev-panel h3 {
            margin-bottom: 5px;
            font-size: 12px;
        }

        .dev-close {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: #003300;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: monospace;
            z-index: 1000;
        }

        .dev-close:hover {
            background-color: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>
    <!-- CRT Monitor Display -->
    <div class="crt-bezel">
        <div class="crt-screen">
            <div class="crt-content">
                <div class="crt-header">
                    <h1>SWTPC-6800 ELIZA</h1>
                    <p>Therapist v1.0</p>
                </div>

                <div class="crt-conversation" id="conversationLog">
                    <div class="crt-line system">Welcome to ELIZA on SWTPC-6800</div>
                    <div class="crt-line system">-----------------------------------</div>
                </div>

                <div class="crt-input-area">
                    <span>YOU:</span>
                    <input type="text" id="userInput" placeholder="your thoughts">
                    <span id="cursor" class="crt-cursor"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Developer Mode Toggle -->
    <button class="dev-toggle" onclick="toggleDevMode()">DEV</button>

    <!-- Hidden Developer Panels -->
    <div class="dev-panels" id="devPanels">
        <button class="dev-close" onclick="toggleDevMode()">CLOSE DEV</button>

        <div class="dev-panel">
            <h3>CPU Controls</h3>
            <button onclick="emulator.run()">▶ Run</button>
            <button onclick="emulator.pause()">⏸ Pause</button>
            <button onclick="emulator.step()">⏭ Step</button>
            <button onclick="emulator.reset()">🔄 Reset</button>
            <label>Speed: <input type="range" id="speedSlider" min="1" max="100" value="50" style="width: 100px;"></label>
        </div>

        <div class="dev-panel">
            <h3>CPU State</h3>
            <div id="cpuState" style="font-size: 11px; font-family: monospace;"></div>
        </div>

        <div class="dev-panel">
            <h3>Memory (0x00-0xFF)</h3>
            <div id="memoryGrid" style="display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; font-size: 9px;"></div>
        </div>

        <div class="dev-panel">
            <h3>Disassembly</h3>
            <div id="disassembly" style="font-size: 10px; max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="cpu6800.js"></script>
    <script src="eliza.js"></script>
    <script src="emulator.js"></script>
    <script>
        const emulator = new Emulator();
        emulator.init();

        const conversationLog = document.getElementById('conversationLog');
        const userInput = document.getElementById('userInput');
        const cursor = document.getElementById('cursor');

        // Hide cursor when typing
        userInput.addEventListener('focus', () => {
            cursor.style.display = 'none';
        });

        userInput.addEventListener('blur', () => {
            cursor.style.display = 'inline-block';
        });

        // Speed control
        const speedSlider = document.getElementById('speedSlider');
        if (speedSlider) {
            speedSlider.addEventListener('change', (e) => {
                const speed = parseInt(e.target.value);
                emulator.setSpeed(speed);
            });
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (message) {
                addConversationLine('user', message);
                emulator.sendInput(message);
                userInput.value = '';
                userInput.focus();
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function addConversationLine(role, text) {
            const line = document.createElement('div');
            line.className = `crt-line ${role}`;
            
            if (role === 'user') {
                line.textContent = `YOU: ${text}`;
            } else if (role === 'eliza') {
                line.textContent = `ELIZA: ${text}`;
            } else {
                line.textContent = text;
                line.classList.add('system');
            }
            
            conversationLog.appendChild(line);
            conversationLog.scrollTop = conversationLog.scrollHeight;
        }

        // ELIZA output handler
        window.onELIZAOutput = (text) => {
            addConversationLine('eliza', text);
        };

        // Dev mode toggle
        function toggleDevMode() {
            const devPanels = document.getElementById('devPanels');
            devPanels.classList.toggle('visible');
        }

        // Auto-focus input
        setTimeout(() => {
            userInput.focus();
        }, 100);

        // Update dev panels
        setInterval(() => {
            if (document.getElementById('devPanels').classList.contains('visible')) {
                updateDevPanels();
            }
        }, 100);

        function updateDevPanels() {
            // CPU State
            const cpu = emulator.cpu;
            document.getElementById('cpuState').innerHTML = `
PC: $${cpu.pc.toString(16).padStart(4, '0')} | 
A: $${cpu.a.toString(16).padStart(2, '0')} | 
B: $${cpu.b.toString(16).padStart(2, '0')} | 
X: $${cpu.x.toString(16).padStart(4, '0')}<br>
SP: $${cpu.sp.toString(16).padStart(4, '0')} | 
CC: $${cpu.cc.toString(16).padStart(2, '0')} | 
Instructions: ${cpu.instructionCount}
            `;

            // Memory grid
            const memoryGrid = document.getElementById('memoryGrid');
            if (memoryGrid.children.length === 0) {
                for (let i = 0; i < 256; i++) {
                    const cell = document.createElement('div');
                    cell.style.border = '1px solid #003300';
                    cell.style.padding = '2px';
                    cell.style.textAlign = 'center';
                    cell.id = `mem-${i}`;
                    memoryGrid.appendChild(cell);
                }
            }
            for (let i = 0; i < 256; i++) {
                const cell = document.getElementById(`mem-${i}`);
                if (cell) {
                    cell.textContent = emulator.cpu.memory[i].toString(16).padStart(2, '0');
                }
            }
        }
    </script>
</body>
</html>
