<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWTPC-6800 ELIZA Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', 'Courier', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .crt-monitor {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            color: #00ff00;
            border: 3px solid #1a1a1a;
            box-shadow: 
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .crt-monitor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        .terminal {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 20;
            font-size: 13px;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            line-height: 1.5;
            font-size: 13px;
        }

        .terminal-output::-webkit-scrollbar {
            width: 8px;
            background: #000000;
        }

        .terminal-output::-webkit-scrollbar-thumb {
            background: #003300;
        }

        .terminal-input {
            display: flex;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            align-items: center;
            gap: 4px;
        }

        .prompt {
            color: #00ff00;
            flex-shrink: 0;
            user-select: none;
            font-weight: normal;
        }

        #commandInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            caret-color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            width: 100%;
            pointer-events: all;
            z-index: 50;
            position: relative;
        }

        #commandInput::placeholder {
            color: #00ff00;
            opacity: 0.3;
        }

        .output-line {
            line-height: 1.5;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-line.system {
            opacity: 0.7;
            font-style: italic;
        }

        .dev-button {
            position: fixed;
            bottom: 5px;
            left: 5px;
            padding: 3px 6px;
            background-color: transparent;
            color: #003300;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            opacity: 0.2;
            z-index: 1000;
        }

        .dev-button:hover {
            opacity: 0.6;
        }

        .dev-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: 999;
            overflow-y: auto;
            padding: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.5;
        }

        .dev-overlay.active {
            display: block;
        }

        .dev-section {
            border: 1px solid #003300;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #000000;
        }

        .dev-section h3 {
            font-size: 11px;
            margin-bottom: 5px;
            text-decoration: underline;
            color: #00ff00;
        }

        .dev-section button {
            padding: 4px 8px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            margin: 2px;
            opacity: 0.7;
        }

        .dev-section button:hover {
            opacity: 1;
            border-color: #00ff00;
        }

        .dev-close {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            z-index: 1001;
        }

        .dev-close:hover {
            border-color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="crt-monitor">
        <div class="terminal">
            <div class="terminal-output" id="output"></div>
            <div class="terminal-input">
                <span class="prompt">> </span>
                <input type="text" id="commandInput" autocomplete="off" spellcheck="false" placeholder="">
            </div>
        </div>
    </div>

    <button class="dev-button" onclick="toggleDev()">DEV</button>

    <div class="dev-overlay" id="devOverlay">
        <button class="dev-close" onclick="toggleDev()">CLOSE</button>
        <div class="dev-section">
            <h3>CPU CONTROLS</h3>
            <button onclick="emulator.run()">RUN</button>
            <button onclick="emulator.pause()">PAUSE</button>
            <button onclick="emulator.step()">STEP</button>
            <button onclick="emulator.reset()">RESET</button>
        </div>
        <div class="dev-section">
            <h3>CPU STATE</h3>
            <div id="cpuState"></div>
        </div>
    </div>

    <script src="cpu6800.js"></script>
    <script src="eliza.js"></script>
    <script src="emulator.js"></script>
    <script>
        const output = document.getElementById('output');
        const commandInput = document.getElementById('commandInput');
        const devOverlay = document.getElementById('devOverlay');

        let emulator = null;

        // Print line to output
        function printLine(text) {
            const line = document.createElement('div');
            line.className = 'output-line';
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // Handle input
        function setupInput() {
            if (!commandInput) {
                return;
            }
            
            commandInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const message = commandInput.value.toUpperCase().trim();
                    
                    if (message) {
                        printLine('> ' + message);
                        
                        if (emulator) {
                            emulator.sendInput(message);
                        }
                        
                        commandInput.value = '';
                    }
                    
                    e.preventDefault();
                }
            });
        }

        // Initialize
        function init() {
            try {
                emulator = new Emulator();
                emulator.loadProgram();
                emulator.run();
            } catch (e) {
                printLine('ERROR: ' + e.message);
            }
            
            printLine('SWTPC-6800 ELIZA THERAPIST v1.0');
            printLine('=====================================');
            printLine('');
            
            commandInput.focus();
        }

        // ELIZA response handler
        window.onELIZAOutput = (text) => {
            printLine(text.toUpperCase());
            printLine('');
        };

        // Dev mode
        function toggleDev() {
            devOverlay.classList.toggle('active');
            if (devOverlay.classList.contains('active')) {
                updateDev();
            }
        }

        function updateDev() {
            if (!emulator || !emulator.cpu) return;
            const cpu = emulator.cpu;
            let state = '';
            state += 'PC: $' + cpu.PC.toString(16).padStart(4, '0').toUpperCase() + '\n';
            state += 'A:  $' + cpu.A.toString(16).padStart(2, '0').toUpperCase() + '\n';
            state += 'B:  $' + cpu.B.toString(16).padStart(2, '0').toUpperCase() + '\n';
            state += 'X:  $' + cpu.X.toString(16).padStart(4, '0').toUpperCase() + '\n';
            state += 'SP: $' + cpu.SP.toString(16).padStart(4, '0').toUpperCase() + '\n';
            state += 'CC: $' + cpu.CC.toString(16).padStart(2, '0').toUpperCase() + '\n';
            state += 'Instructions: ' + (cpu.instructionCount || 0);
            document.getElementById('cpuState').textContent = state;
        }

        setInterval(() => {
            if (devOverlay.classList.contains('active')) {
                updateDev();
            }
        }, 100);

        // Setup and start
        setupInput();
        init();
    </script>
</body>
</html>
