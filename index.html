<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWTPC-6800 ELIZA Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', 'Courier', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.4;
            letter-spacing: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CRT Screen Container */
        .crt-monitor {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            color: #00ff00;
            border: 3px solid #1a1a1a;
            box-shadow: 
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Scanlines effect */
        .crt-monitor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Screen content */
        .terminal {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 50;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Terminal output area */
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            line-height: 1.5;
        }

        .terminal-output::-webkit-scrollbar {
            width: 8px;
            background: #000000;
        }

        .terminal-output::-webkit-scrollbar-thumb {
            background: #003300;
        }

        /* Input line */
        .terminal-input {
            display: flex;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
        }

        .prompt {
            color: #00ff00;
            flex-shrink: 0;
            user-select: none;
        }

        #commandInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            caret-color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
        }

        #commandInput::selection {
            background: #003300;
            color: #00ff00;
        }

        /* Text output classes */
        .output-line {
            line-height: 1.5;
            margin: 0;
        }

        .output-line.command {
            font-weight: bold;
            color: #00ff00;
        }

        .output-line.response {
            color: #00ff00;
            margin-top: 2px;
            margin-bottom: 5px;
        }

        .output-line.system {
            color: #00ff00;
            opacity: 0.7;
            font-style: italic;
        }

        /* Dev button - hidden in corner */
        .dev-button {
            position: fixed;
            bottom: 5px;
            left: 5px;
            padding: 3px 6px;
            background-color: transparent;
            color: #003300;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            opacity: 0.2;
            z-index: 1000;
        }

        .dev-button:hover {
            opacity: 0.6;
        }

        /* Dev overlay */
        .dev-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: 999;
            overflow-y: auto;
            padding: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.5;
        }

        .dev-overlay.active {
            display: block;
        }

        .dev-section {
            border: 1px solid #003300;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #000000;
        }

        .dev-section h3 {
            font-size: 11px;
            margin-bottom: 5px;
            text-decoration: underline;
            color: #00ff00;
        }

        .dev-button-group {
            margin-bottom: 10px;
        }

        .dev-button-group button {
            padding: 4px 8px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            margin: 2px;
            opacity: 0.7;
        }

        .dev-button-group button:hover {
            opacity: 1;
            border-color: #00ff00;
        }

        .dev-close {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            background-color: #001100;
            color: #00ff00;
            border: 1px solid #003300;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            z-index: 1001;
        }

        .dev-close:hover {
            border-color: #00ff00;
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Main CRT Terminal -->
    <div class="crt-monitor">
        <div class="terminal">
            <div class="terminal-output" id="output">
            </div>
            <div class="terminal-input">
                <span class="prompt">> </span>
                <input type="text" id="commandInput" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- Hidden dev button -->
    <button class="dev-button" onclick="toggleDev()">DEV</button>

    <!-- Dev overlay -->
    <div class="dev-overlay" id="devOverlay">
        <button class="dev-close" onclick="toggleDev()">CLOSE</button>

        <div class="dev-section">
            <h3>CPU CONTROLS</h3>
            <div class="dev-button-group">
                <button onclick="emulator.run()">RUN</button>
                <button onclick="emulator.pause()">PAUSE</button>
                <button onclick="emulator.step()">STEP</button>
                <button onclick="emulator.reset()">RESET</button>
            </div>
            <label>Speed: <input type="range" id="speedSlider" min="1" max="100" value="50" style="width: 100px; vertical-align: middle;"></label>
        </div>

        <div class="dev-section">
            <h3>CPU STATE</h3>
            <div id="cpuState"></div>
        </div>

        <div class="dev-section">
            <h3>MEMORY (0x00-0xFF)</h3>
            <div id="memoryGrid" style="display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; font-size: 9px;"></div>
        </div>
    </div>

    <script src="cpu6800.js"></script>
    <script src="eliza.js"></script>
    <script src="emulator.js"></script>
    <script>
        const output = document.getElementById('output');
        const commandInput = document.getElementById('commandInput');
        const devOverlay = document.getElementById('devOverlay');

        let emulator = null;

        // Initialize immediately
        function initializeTerminal() {
            if (!output || !commandInput) return;
            
            emulator = new Emulator();
            emulator.init();
            
            // Print header
            printOutput('SWTPC-6800 ELIZA THERAPIST v1.0', 'system');
            printOutput('=====================================', 'system');
            printOutput('', 'system');
            
            // Focus input
            commandInput.focus();
            
            // Start emulator running
            emulator.run();
        }

        // Handle input
        if (commandInput) {
            commandInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const command = commandInput.value.toUpperCase().trim();
                    
                    if (command) {
                        // Echo user input
                        printOutput('> ' + command, 'command');
                        
                        // Send to ELIZA
                        if (emulator) {
                            emulator.sendInput(command);
                        }
                        
                        // Clear input
                        commandInput.value = '';
                    }
                    
                    e.preventDefault();
                }
            });
        }

        function printOutput(text, type = 'response') {
            if (!output) return;
            const line = document.createElement('div');
            line.className = 'output-line ' + type;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // ELIZA output handler
        window.onELIZAOutput = (text) => {
            // Convert to uppercase for authentic 70s look
            const elizaText = text.toUpperCase();
            printOutput(elizaText, 'response');
            printOutput('', 'system');
        };

        // Dev mode toggle
        function toggleDev() {
            devOverlay.classList.toggle('active');
            if (devOverlay.classList.contains('active')) {
                updateDevDisplay();
            }
        }

        // Update dev display
        setInterval(() => {
            if (devOverlay.classList.contains('active') && emulator && emulator.cpu) {
                updateDevDisplay();
            }
        }, 100);

        function updateDevDisplay() {
            if (!emulator || !emulator.cpu) return;
            
            const cpu = emulator.cpu;
            
            // CPU State
            let stateText = '';
            stateText += 'PC: $' + cpu.pc.toString(16).padStart(4, '0').toUpperCase() + '\n';
            stateText += 'A:  $' + cpu.a.toString(16).padStart(2, '0').toUpperCase() + '\n';
            stateText += 'B:  $' + cpu.b.toString(16).padStart(2, '0').toUpperCase() + '\n';
            stateText += 'X:  $' + cpu.x.toString(16).padStart(4, '0').toUpperCase() + '\n';
            stateText += 'SP: $' + cpu.sp.toString(16).padStart(4, '0').toUpperCase() + '\n';
            stateText += 'CC: $' + cpu.cc.toString(16).padStart(2, '0').toUpperCase() + '\n';
            stateText += 'Instructions: ' + cpu.instructionCount;
            document.getElementById('cpuState').textContent = stateText;

            // Memory grid
            const memoryGrid = document.getElementById('memoryGrid');
            if (memoryGrid.children.length === 0) {
                for (let i = 0; i < 256; i++) {
                    const cell = document.createElement('div');
                    cell.style.border = '1px solid #003300';
                    cell.style.padding = '2px';
                    cell.style.textAlign = 'center';
                    cell.style.backgroundColor = '#000000';
                    cell.id = 'mem-' + i;
                    memoryGrid.appendChild(cell);
                }
            }
            for (let i = 0; i < 256; i++) {
                const cell = document.getElementById('mem-' + i);
                if (cell) {
                    cell.textContent = emulator.cpu.memory[i].toString(16).padStart(2, '0').toUpperCase();
                }
            }
        }

        // Speed slider
        const speedSlider = document.getElementById('speedSlider');
        if (speedSlider) {
            speedSlider.addEventListener('change', (e) => {
                if (emulator) {
                    emulator.setSpeed(parseInt(e.target.value));
                }
            });
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTerminal);
        } else {
            // DOM is already ready
            initializeTerminal();
        }
    </script>
</body>
</html>
